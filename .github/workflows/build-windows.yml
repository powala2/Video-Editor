name: Build Windows app

# Builds the Python (PySide6) desktop app into a Windows installer + a portable
# zip on a GitHub-hosted Windows runner. Runs on push to the implementation
# branch, on manual dispatch, and on version tags (which also publish a Release).

on:
  push:
    branches:
      - claude/video-studio-implementation-7vr7t0
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.11.1

      - name: Build the app (PyInstaller)
        run: pyinstaller --noconfirm VideoStudio.spec

      - name: Package portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/Video Studio/*" -DestinationPath "VideoStudio-Windows-portable.zip" -Force

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          # Keep the installer version in lockstep with videostudio.__version__.
          $ver = python -c "import videostudio, sys; sys.stdout.write(videostudio.__version__)"
          Write-Host "Building installer for version $ver"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVer=$ver" installer.iss

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Video-Studio-Windows
          path: |
            installer_out/VideoStudioSetup.exe
            VideoStudio-Windows-portable.zip
          if-no-files-found: error
          retention-days: 30

      - name: Attach to Release (tagged builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer_out/VideoStudioSetup.exe
            VideoStudio-Windows-portable.zip
